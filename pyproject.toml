[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-hr-assistant"
version = "0.1.0"
description = "A PDF-based employee HR assistant"
requires-python = ">=3.12.16,<3.13"
authors = [{name = "Ghassen Saidi"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "boto3",
    "certifi>=2026.10.23",
    "chromadb==1.5.9",
    "fastapi",
    "filelock>=4.2.1",
    "openai",
    "pydantic>=2.14.2,<3",
    "PyMuPDF>=2.1,<3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]"
]

[project.optional-dependencies]
dev = ["boto3-stubs-lite[s3,dynamodb]"]

[project.urls]
Repository = "https://github.com/GhSaidi/employee-hr-assistant"
LinkedIn = "https://www.linkedin.com/in/ghassensaidi/"

[project.scripts]
hr-assistant = "employee_hr_assistant.main:main"

[tool.setuptools.packages.find]
where = ["backend/src"]